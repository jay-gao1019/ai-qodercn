server:
  port: 8000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/email_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

email:
  task:
    # v2.35 需求3.5：每个发送任务独占一个线程直到发完（任务内部按间隔 sleep），
    # queue-capacity=0 让线程池成为并行度的唯一闸门，超额提交立即被拒绝并给出提示，而不是排队后看似"没反应"
    pool:
      core-size: 10
      max-size: 30
      queue-capacity: 0
